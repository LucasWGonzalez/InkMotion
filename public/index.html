<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebAR Storyteller - Image Tracking & Parallax</title>

  <!-- MindAR SDK -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image.prod.js"></script>

  <!-- Estilos globales -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/parallax.css">
  <link rel="stylesheet" href="css/ui.css">

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>
</head>
<body>
  <!-- Contenedor principal de AR -->
  <div id="ar-container">
    <!-- Canvas de video/cámara -->
    <div id="camera-feed">
      <video id="video-stream" autoplay playsinline muted></video>
    </div>

    <!-- Overlay de contenido AR -->
    <div id="ar-overlay">
      <!-- Targets y contenido dinámico se insertan aquí -->
    </div>

    <!-- UI de control -->
    <div id="ui-container">
      <div id="ui-panel">
        <button id="btn-upload-target" class="btn btn-primary">Subir Imagen Target</button>
        <button id="btn-reset-tracking" class="btn btn-secondary">Resetear Tracking</button>
        <div id="status-display">Cargando...</div>
      </div>
    </div>
  </div>

  <!-- Scripts en orden de dependencia -->
  <!-- Esperar a que MindAR esté disponible -->
  <script>
    // Esperar a que la CDN de MindAR se cargue
    function waitForMindAR(callback, maxWait = 10000) {
      const startTime = Date.now();
      const checkInterval = setInterval(() => {
        if (typeof window.MINDAR !== 'undefined') {
          clearInterval(checkInterval);
          callback();
        } else if (Date.now() - startTime > maxWait) {
          clearInterval(checkInterval);
          console.warn('MindAR no cargó dentro del tiempo limite, procendiendo igual...');
          callback();
        }
      }, 100);
    }
  </script>

  <!-- 1. Utilities (sin dependencias) -->
  <script type="module" src="utils/EventBus.js"></script>
  <script type="module" src="utils/DeviceMotionListener.js"></script>

  <!-- 2. Core Engines -->
  <script type="module" src="core/ImageProcessor.js"></script>
  <script type="module" src="core/ParallaxEngine.js"></script>
  <script type="module" src="core/MindARManager.js"></script>

  <!-- 3. UI Components -->
  <script type="module" src="ui/UIController.js"></script>

  <!-- 4. Main App (orquestador) - Ejecutar cuando todo esté listo -->
  <script type="module">
    import('./app.js');
  </script>
</body>
</html>
