<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090912">
  <title>InkMotion · Libros Vivos</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/parallax.css">
  <link rel="stylesheet" href="css/ui.css">
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
</head>
<body>
  <main id="ar-container">
    <div id="camera-feed" aria-label="Vista de cámara">
      <video id="video-stream" autoplay playsinline muted></video>
    </div>
    <div id="ar-overlay"></div>

    <section id="preview-panel" class="preview-panel" hidden aria-label="Vista Previa de Cuento AR">
      <div class="preview-heading">
        <span class="preview-kicker">LIBROS VIVOS</span>
        <strong>Vista Previa de Cuento AR</strong>
        <small>Anclaje MindAR · relieve automático · loop de 5 segundos</small>
      </div>
      <div class="mode-switch" role="group" aria-label="Modo de vista">
        <button id="btn-mode-3d" class="mode-btn is-active" type="button" aria-pressed="true">
          <span aria-hidden="true">✦</span> Efecto 3D
        </button>
        <button id="btn-mode-camera" class="mode-btn" type="button" aria-pressed="false">
          <span aria-hidden="true">◉</span> Solo cámara
        </button>
      </div>
    </section>

    <div id="ui-container">
      <div id="ui-panel">
        <button id="btn-upload-target" class="btn btn-primary" type="button">Subir ilustración</button>
        <button id="btn-reset-tracking" class="btn btn-secondary" type="button">Buscar marcador</button>
        <div id="status-display" role="status" aria-live="polite">Preparando InkMotion…</div>
      </div>
    </div>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
